# Runs the dashboard next to the backend stack. Caddy (in GravyFlow-Backend-)
# proxies GRAVYFLOW_DASHBOARD_HOST to gravyflow-frontend:3000 on
# gravyflow-network, so start the backend stack first:
#   docker compose up -d --build
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: gravyflow-frontend:latest
    container_name: gravyflow-frontend
    restart: unless-stopped
    networks:
      - gravyflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gravyflow-network:
    external: true
